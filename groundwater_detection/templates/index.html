<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groundwater Detection - Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 w-1/3 text-center">
        <h1 class="text-2xl font-bold mb-4">Upload Land Image</h1>
        <form action="/" method="post" enctype="multipart/form-data">
            <input type="file" name="file" id="file" required class="block w-full text-gray-700 mb-4">
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Predict</button>
        </form>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mt-4">
                {% for message in messages %}
                  <p class="text-red-500">{{ message }}</p>
                {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
